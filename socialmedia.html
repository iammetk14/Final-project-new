<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Bootstrap CSS -->
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
<!-- My CSS -->
<link rel="stylesheet" href="socialmedia.css" />
<!-- Font Awesome -->
<script src="https://kit.fontawesome.com/996973c893.js"></script>
<!-- Google Fonts -->
<link
    href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@400;500;600;700;800&family=Roboto+Slab:wght@200;400;600;900&display=swap"
    rel="stylesheet" />
<!--Icons-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
<title>Social Media</title>
</head>

<body>
    <div id="Social Media" class="container-fluid">
        <div class="container text-white py-6">
            <h1 class="text-warning">Social Media</h1>
            <h2 class="m-heading">Lets be friends!!</h2>
            <div class="row pt-3">
                <div class="col-3 media_link btn m-3" href="#">
                    <div class="row">
                        <div class="col-6  d-flex justify-content-start text-info">
                            <h3 class="m-0 pt-2">LinkedIn</h3>
                        </div>
                        <div class="col-6 d-flex justify-conent-end text-info">
                            <i class="fab fa-linkedin-in fa-2x"></i>
                        </div>
                    </div>
                </div>
                <div class="col-3 media_link btn m-3" href="#">
                    <div class="row">
                        <div class="col-6  d-flex justify-content-start text-white">
                            <h3 class="m-0 pt-2">Github</h3>
                        </div>
                        <div class="col-6 d-flex justify-conent-end text-white">
                            <i class="fab fa-github fa-2x"></i>
                        </div>
                    </div>
                </div>
                    <div class="col-3 media_link btn m-3" href="#">
                        <div class="row">
                            <div class="col-6  d-flex justify-content-start text-danger">
                                <h3 class="m-0 pt-2">Youtube</h3>
                            </div>
                            <div class="col-6 d-flex justify-conent-end text-white">
                                <i class="fab fa-youtube fa-2x"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-3 media_link btn m-3" href="#">
                        <div class="row">
                            <div class="col-6  d-flex justify-content-start text-white">
                                <h3 class="m-0 pt-2">Instagram</h3>
                            </div>
                            <div class="col-6 d-flex justify-conent-end text-white">
                                <i class="fab fa-instagram fa-2x"></i>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</body>

</html>
